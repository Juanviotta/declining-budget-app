<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Family Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Budget">
<meta name="theme-color" content="#7B9E87">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#F7F5F0;font-family:'Segoe UI',system-ui,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;}

  /* ── Login ── */
  #login-screen{min-height:100vh;background:linear-gradient(160deg,#EEE9E0,#F7F5F0);display:flex;align-items:center;justify-content:center;}
  .login-card{background:#fff;border-radius:28px;padding:48px 36px;text-align:center;box-shadow:0 8px 40px rgba(100,85,70,.12);}
  .login-logo{font-size:48px;margin-bottom:12px;}
  .login-title{color:#2D2A26;font-size:26px;font-weight:800;margin-bottom:8px;}
  .login-sub{color:#6F665C;font-size:14px;margin-bottom:32px;}
  .login-users{display:flex;gap:16px;justify-content:center;}
  .login-btn{display:flex;flex-direction:column;align-items:center;gap:10px;background:#F7F5F0;border:2px solid;border-radius:18px;padding:20px 28px;cursor:pointer;min-width:100px;transition:transform .15s;}
  .login-btn:active{transform:scale(.96);}
  .login-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;}
  .login-name{font-weight:700;font-size:18px;color:#2D2A26;}

  /* ── App Shell ── */
  #app{display:none;flex-direction:column;min-height:100vh;}
  header{background:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E4DFD6;position:sticky;top:0;z-index:10;box-shadow:0 1px 6px rgba(100,85,70,.06);}
  .header-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:#2D2A26;}
  .month-nav{display:flex;align-items:center;gap:8px;}
  .month-nav button{background:none;border:none;color:#6F665C;font-size:22px;cursor:pointer;padding:0 4px;line-height:1;min-width:36px;min-height:40px;}
  .month-label{font-weight:700;color:#2D2A26;font-size:14px;min-width:80px;text-align:center;background:none;border:none;cursor:pointer;font-family:inherit;}
  .user-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;}
  .signout-btn{background:none;border:1px solid #E4DFD6;border-radius:8px;color:#6F665C;font-size:12px;cursor:pointer;padding:4px 10px;}
  .header-right{display:flex;align-items:center;gap:8px;}

  /* ── Sync indicator ── */
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#7B9E87;margin-left:4px;}
  .sync-dot.syncing{background:#BE9B7B;animation:pulse 1s infinite;}
  .sync-dot.error{background:#C97B7B;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  /* ── Main ── */
  main{padding:16px;padding-bottom:calc(100px + env(safe-area-inset-bottom));flex:1;}

  /* ── Tabs ── */
  nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #E4DFD6;display:flex;align-items:center;justify-content:space-around;padding:10px 0 calc(14px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -2px 12px rgba(100,85,70,.07);}
  .nav-item{display:flex;flex-direction:column;align-items:center;background:none;border:none;color:#766D63;cursor:pointer;min-width:56px;padding:4px 0;font-size:10px;gap:2px;}
  .nav-item.active{color:#7B9E87;}
  .nav-item span.icon{font-size:20px;}
  .add-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#7B9E87,#C97B7B);border:none;color:#fff;cursor:pointer;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(123,158,135,.4);margin-top:-10px;}

  /* ── Views ── */
  .view{display:none;}
  .view.active{display:block;}

  /* ── Overview card ── */
  .overview-card{background:linear-gradient(135deg,#5E8470,#4A6B58);border-radius:20px;padding:20px 20px 14px;margin-bottom:20px;box-shadow:0 4px 20px rgba(123,158,135,.3);}
  .ov-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;}
  .ov-label{color:rgba(255,255,255,.9);font-size:12px;margin-bottom:2px;}
  .ov-value{color:#fff;font-size:26px;font-weight:800;}
  .ov-value.danger{color:#FFD4D4;}
  .progress-bg{background:rgba(255,255,255,.25);border-radius:99px;height:7px;overflow:hidden;margin-bottom:6px;}
  .progress-fill{height:100%;border-radius:99px;transition:width .4s ease;}
  .ov-meta{display:flex;justify-content:space-between;}
  .ov-meta span{color:rgba(255,255,255,.9);font-size:11px;}

  /* ── Section label ── */
  .section-label{color:#6F665C;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}

  /* ── Category grid ── */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .cat-card{background:#fff;border-radius:18px;padding:14px;border:1px solid #E4DFD6;box-shadow:0 2px 8px rgba(100,85,70,.06);cursor:pointer;}
  .cat-card-name{font-weight:700;color:#2D2A26;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;}
  .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:2px;}
  .cat-remaining{font-size:20px;font-weight:800;margin-bottom:2px;}
  .cat-sub{color:#6F665C;font-size:11px;margin-bottom:10px;}
  .cat-spent{color:#766D63;font-size:10px;margin-top:4px;}
  .over-budget-card{border:1.5px solid #C97B7B !important;background:#FFF8F8 !important;}
  .over-budget-badge{font-size:14px;line-height:1;}

  /* ── Transaction row ── */
  .tx-row{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;border:1px solid #E4DFD6;box-shadow:0 1px 4px rgba(100,85,70,.05);}
  .tx-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tx-dot{width:10px;height:10px;border-radius:50%;}
  .tx-info{flex:1;margin-left:12px;}
  .tx-name{color:#2D2A26;font-weight:600;font-size:13px;}
  .tx-meta{color:#6F665C;font-size:11px;}
  .tx-amount{color:#A85656;font-weight:700;font-size:15px;margin-right:6px;}
  .tx-actions{display:flex;align-items:center;gap:6px;}
  .edit-btn{background:#F7F5F0;border:1px solid #E4DFD6;border-radius:8px;color:#5C544B;font-size:13px;padding:0 12px;min-height:36px;cursor:pointer;}
  .del-btn{background:none;border:none;color:#A85656;font-size:20px;cursor:pointer;min-width:40px;min-height:40px;}

  /* ── Filter pills ── */
  .filter-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
  .filter-btn{background:#fff;border:1px solid #E4DFD6;border-radius:20px;color:#5C544B;font-size:13px;padding:0 14px;min-height:36px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .filter-btn.active{background:#EDF3EF;border-color:#7B9E87;color:#5E8470;}

  /* ── Categories list ── */
  .add-cat-btn{width:100%;background:#fff;border:2px dashed #D9D3CB;border-radius:14px;color:#6F665C;font-size:14px;font-weight:600;padding:14px;cursor:pointer;margin-bottom:16px;}
  .cat-list-row{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;border:1px solid #E4DFD6;box-shadow:0 1px 4px rgba(100,85,70,.05);}
  .cat-list-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
  .cat-list-info{flex:1;margin-left:14px;}
  .cat-list-name{color:#2D2A26;font-weight:700;font-size:14px;}
  .cat-list-sub{color:#6F665C;font-size:12px;}

  /* ── Reports ── */
  .stat-grid{display:flex;justify-content:space-between;padding:4px 0;}
  .stat-item{}
  .stat-label{color:rgba(255,255,255,.9);font-size:11px;margin-bottom:4px;}
  .stat-value{color:#fff;font-size:20px;font-weight:800;}
  .user-cards{display:flex;gap:12px;margin-bottom:20px;}
  .user-card{flex:1;background:#F7F5F0;border-radius:14px;padding:14px 16px;border:1px solid #E4DFD6;}
  .user-card-amt{color:#2D2A26;font-weight:700;font-size:18px;}
  .user-card-name{color:#6F665C;font-size:12px;}
  .bar-row{margin-bottom:14px;}
  .bar-labels{display:flex;justify-content:space-between;margin-bottom:5px;}
  .bar-name{color:#2D2A26;font-size:13px;font-weight:600;}
  .bar-amt{font-weight:700;font-size:13px;}
  .insight-card{background:#FDF8F3;border:1px solid #EAE2D8;border-radius:18px;padding:18px;margin-top:20px;}
  .insight-title{color:#2D2A26;font-weight:700;margin-bottom:4px;}
  .insight-body{color:#7A7068;font-size:13px;}

  /* ── Empty state ── */
  .empty{color:#766D63;text-align:center;margin-top:60px;font-size:14px;}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(45,42,38,.4);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(4px);display:none;}
  .modal-overlay.open{display:flex;}
  .modal-card{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px calc(32px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-title{color:#2D2A26;font-weight:800;font-size:18px;}
  .modal-close{background:none;border:none;color:#766D63;font-size:28px;cursor:pointer;line-height:1;min-width:44px;min-height:44px;}
  label.field-label{display:block;color:#6F665C;font-size:12px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
  input.field, select.field{width:100%;background:#F7F5F0;border:1px solid #E4DFD6;border-radius:12px;color:#2D2A26;font-size:16px;padding:12px 14px;margin-bottom:16px;}
  input.field:focus, select.field:focus{border-color:#4A6B58;}
  .primary-btn{width:100%;background:linear-gradient(135deg,#5E8470,#4A6B58);border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:700;padding:14px;cursor:pointer;margin-top:4px;box-shadow:0 4px 14px rgba(123,158,135,.35);}
  .color-palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .color-swatch{width:36px;height:36px;padding:0;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border .15s;}
  .color-swatch.selected{border-color:#2D2A26;}
  .remaining-hint{font-size:12px;margin-bottom:12px;margin-top:-10px;}

  /* ── Toast ── */
  #toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#2D2A26;color:#F7F5F0;border-radius:14px;padding:12px 20px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(45,42,38,.25);max-width:90vw;display:none;align-items:center;gap:14px;}


  /* ── PIN Screen ── */
  #pin-screen{min-height:100vh;background:linear-gradient(160deg,#EEE9E0,#F7F5F0);display:none;align-items:center;justify-content:center;}
  .pin-card{background:#fff;border-radius:28px;padding:36px 28px 32px;text-align:center;box-shadow:0 8px 40px rgba(100,85,70,.12);width:300px;}
  .pin-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;margin:0 auto 12px;}
  .pin-name{color:#2D2A26;font-size:20px;font-weight:800;margin-bottom:4px;}
  .pin-sub{color:#6F665C;font-size:13px;margin-bottom:24px;}
  .pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:28px;}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:#E4DFD6;transition:background .15s;}
  .pin-dot.filled{background:#7B9E87;}
  .pin-dot.error{background:#C97B7B;}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
  .pin-key{background:#F7F5F0;border:1px solid #E4DFD6;border-radius:14px;height:56px;font-size:20px;font-weight:700;color:#2D2A26;cursor:pointer;transition:background .1s,transform .1s;}
  .pin-key:active{background:#E4DFD6;transform:scale(.95);}
  .pin-key.del{color:#6F665C;font-size:16px;}
  .pin-key.empty{background:transparent;border:none;cursor:default;}
  .pin-back{background:none;border:none;color:#6F665C;font-size:13px;cursor:pointer;margin-top:8px;text-decoration:underline;}
  .pin-error{color:#C97B7B;font-size:12px;min-height:18px;margin-bottom:10px;}

  /* ── Loading ── */
  #loading{position:fixed;inset:0;background:#F7F5F0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:999;}
  .spinner{width:36px;height:36px;border:3px solid #E4DFD6;border-top-color:#7B9E87;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* ── Added: accessibility, pace, forms ── */
  :focus-visible{outline:3px solid #4A6B58;outline-offset:2px;}
  .cat-card:focus-visible{outline-offset:3px;}
  .ov-value.danger{color:#FFE3E3;}
  .over-budget-card .cat-remaining,.over-text{color:#A85656 !important;}
  .ok-text{color:#4F7360;}
  .pace{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;font-weight:600;}
  .pace small{font-weight:400;opacity:.9;}
  .log-summary{color:#5C544B;font-size:13px;margin:-6px 0 12px;}
  .form-error{color:#A85656;font-size:13px;min-height:18px;margin:-6px 0 10px;}
  .primary-btn[disabled]{opacity:.6;cursor:wait;}
  .secondary-btn{width:100%;background:#F7F5F0;border:1px solid #E4DFD6;border-radius:14px;color:#2D2A26;font-size:15px;font-weight:600;padding:12px;cursor:pointer;margin-top:10px;}
  .detail-actions{display:flex;gap:10px;margin-bottom:14px;}
  .detail-actions .secondary-btn{margin-top:0;}
  #toast button{background:none;border:none;color:#BFE3CC;font-weight:800;font-size:13px;cursor:pointer;text-decoration:underline;min-height:32px;}
  .empty-card{background:#fff;border:1px dashed #D9D3CB;border-radius:18px;padding:20px;text-align:center;color:#5C544B;font-size:14px;margin-bottom:20px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading" role="status" aria-live="polite">
  <div style="font-size:36px" aria-hidden="true">💰</div>
  <div class="spinner" aria-hidden="true"></div>
  <div style="color:#6F665C;font-size:13px;">Connecting…</div>
</div>

<!-- Login -->
<div id="login-screen" style="display:none;">
  <div class="login-card">
    <div class="login-logo" aria-hidden="true">💰</div>
    <h1 class="login-title">Family Budget</h1>
    <p class="login-sub">Who's logging in?</p>
    <div class="login-users" id="login-users"></div>
  </div>
</div>

<!-- PIN Screen -->
<div id="pin-screen" style="display:none;">
  <div class="pin-card" role="group" aria-labelledby="pin-name">
    <div class="pin-avatar" id="pin-avatar" aria-hidden="true"></div>
    <h1 class="pin-name" id="pin-name"></h1>
    <div class="pin-sub">Enter your 4-digit PIN</div>
    <div class="pin-error" id="pin-error" role="alert"></div>
    <div class="pin-dots" aria-hidden="true">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="sr-only" id="pin-progress" aria-live="polite"></div>
    <div class="pin-pad">
      <button class="pin-key" data-pin="1">1</button>
      <button class="pin-key" data-pin="2">2</button>
      <button class="pin-key" data-pin="3">3</button>
      <button class="pin-key" data-pin="4">4</button>
      <button class="pin-key" data-pin="5">5</button>
      <button class="pin-key" data-pin="6">6</button>
      <button class="pin-key" data-pin="7">7</button>
      <button class="pin-key" data-pin="8">8</button>
      <button class="pin-key" data-pin="9">9</button>
      <span class="pin-key empty" aria-hidden="true"></span>
      <button class="pin-key" data-pin="0">0</button>
      <button class="pin-key del" id="pin-del" aria-label="Delete last digit">⌫</button>
    </div>
    <button class="pin-back" id="pin-back">Not you? Switch profile</button>
  </div>
</div>

<!-- App -->
<div id="app" style="display:none;">
  <header>
    <div class="header-brand"><span aria-hidden="true">💰</span> Budget <div class="sync-dot" id="sync-dot" role="img" aria-label="Synced" title="Synced"></div></div>
    <div class="month-nav">
      <button id="month-prev" aria-label="Previous month">‹</button>
      <button class="month-label" id="month-label" title="Jump to this month"></button>
      <button id="month-next" aria-label="Next month">›</button>
    </div>
    <div class="header-right">
      <div class="user-badge" id="user-badge" aria-hidden="true"></div>
      <button class="signout-btn" id="signout-btn">Sign out</button>
    </div>
  </header>

  <main>
    <!-- Dashboard -->
    <section class="view active" id="view-dashboard" aria-label="Home">
      <div class="overview-card">
        <div class="ov-row">
          <div><div class="ov-label">Total budget</div><div class="ov-value" id="ov-budget">–</div></div>
          <div style="text-align:right"><div class="ov-label" id="ov-remaining-lbl">Left to spend</div><div class="ov-value" id="ov-remaining">–</div></div>
        </div>
        <div class="progress-bg" role="progressbar" aria-label="Share of budget used" aria-valuemin="0" aria-valuemax="100" id="ov-progress"><div class="progress-fill" id="ov-bar"></div></div>
        <div class="ov-meta"><span id="ov-spent-lbl"></span><span id="ov-pct-lbl"></span></div>
        <div class="pace" id="ov-pace"></div>
      </div>
      <div id="dash-empty"></div>
      <h2 class="section-label">Categories</h2>
      <div class="cat-grid" id="cat-grid"></div>
      <h2 class="section-label" id="recent-label">Latest expenses</h2>
      <div id="recent-list"></div>
    </section>

    <!-- Log -->
    <section class="view" id="view-log" aria-label="Expense log">
      <div class="filter-row" id="log-filters" role="group" aria-label="Filter by person"></div>
      <div class="log-summary" id="log-summary" aria-live="polite"></div>
      <div id="tx-list"></div>
    </section>

    <!-- Categories -->
    <section class="view" id="view-categories" aria-label="Categories">
      <button class="add-cat-btn" data-open="modal-addcat">+ Add category</button>
      <div id="cat-list"></div>
    </section>

    <!-- Reports -->
    <section class="view" id="view-reports" aria-label="Reports">
      <div class="filter-row" id="report-months" role="group" aria-label="Report month"></div>
      <div id="report-content"></div>
    </section>
  </main>

  <nav class="bottom" aria-label="Main">
    <button class="nav-item active" id="nav-dashboard" data-view="dashboard" aria-current="page"><span class="icon" aria-hidden="true">🏠</span>Home</button>
    <button class="nav-item" id="nav-log" data-view="log"><span class="icon" aria-hidden="true">📋</span>Log</button>
    <button class="add-btn" data-open="modal-expense" aria-label="Log an expense">+</button>
    <button class="nav-item" id="nav-categories" data-view="categories"><span class="icon" aria-hidden="true">🗂️</span>Categories</button>
    <button class="nav-item" id="nav-reports" data-view="reports"><span class="icon" aria-hidden="true">📊</span>Reports</button>
  </nav>
</div>

<!-- Toast -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- ── Modals ── -->

<!-- Log Expense -->
<div class="modal-overlay" id="modal-expense">
  <form class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exp-title" id="form-expense" novalidate>
    <div class="modal-header">
      <h2 class="modal-title" id="exp-title">Log expense</h2>
      <button type="button" class="modal-close" data-close="modal-expense" aria-label="Close">×</button>
    </div>
    <label class="field-label" for="exp-amount">Amount ($)</label>
    <input class="field" type="number" id="exp-amount" step="0.01" min="0" inputmode="decimal" placeholder="0.00" autocomplete="off">
    <label class="field-label" for="exp-cat">Category</label>
    <select class="field" id="exp-cat"></select>
    <div class="remaining-hint" id="remaining-hint" aria-live="polite"></div>

<script type="module">

// PINs are stored as salted SHA-256 hashes so they can't be read straight from the page source.
// This is a convenience lock, not real security: a 4-digit PIN can be guessed by anyone who has the code.
// To set a new PIN, open the app, then run this in the browser console and paste the result below:
//   await hashPin("JVO", "1234")
const PIN_HASHES = {

};

// ── Small helpers ─────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const usd = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
const money = n => usd.format(Math.round((Number(n)||0)*100)/100);
const cents = n => Math.round(n*100)/100;
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
const safeColor = c => /^#[0-9a-fA-F]{3,8}$/.test(c||"") ? c : "#888888";
function uid(){ return `id_${Date.now()}_${Math.random().toString(36).slice(2,7)}`; }
function getMonthKey(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function monthLabel(mk){ const [y,m] = mk.split("-").map(Number); return `${MONTH_NAMES[m-1]} ${y}`; }
function toDateInput(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fromDateInput(v){ const [y,m,d] = v.split("-").map(Number); return new Date(y, m-1, d, 12); }
function daysInMonth(mk){ const [y,m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function parseAmount(v){ const n = parseFloat(v); return Number.isFinite(n) ? cents(n) : NaN; }
function store(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }
function load(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function friendlyDate(iso){
  const d = new Date(iso), t = new Date();
  const y = new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "Today";
  if(d.toDateString()===y.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

async function sha256Hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
window.hashPin = (user, pin) => sha256Hex(`declining-budget:${user}:${pin}`);

// ── State ─────────────────────────────────────────────────────────────────
let state = { categories: DEFAULT_CATS, expenses: [], budgets: {} };
let loaded = false;

// ── Firebase sync ─────────────────────────────────────────────────────────
function setSyncStatus(s){ // "ok" | "syncing" | "error"
  const dot = $("sync-dot");
  dot.className = "sync-dot" + (s==="syncing"?" syncing":s==="error"?" error":"");
  const label = s==="syncing" ? "Syncing…" : s==="error" ? "Not synced, check your connection" : "Synced";
  dot.title = label; dot.setAttribute("aria-label", label);
}

async function initFirestore(){
  setSyncStatus("syncing");
  try {
    const snap = await getDoc(DOC);
    if(!snap.exists()){
      await setDoc(DOC, { categories: DEFAULT_CATS, expenses: [], budgets: {}, version: 2 });
    } else {
      const d = snap.data();
      if(!d.version || d.version < 2){
        await setDoc(DOC, { categories: DEFAULT_CATS, expenses: d.expenses || [], budgets: d.budgets || {}, version: 2 });
      }
    }
  } catch(e){
    console.error(e);
    setSyncStatus("error");
    showToast("Couldn't connect. Showing the last data on this phone, if any.");
  }

  unsubscribe = onSnapshot(DOC, (snap) => {
    if(snap.exists()){
      const d = snap.data();
      state = { ...d, categories: d.categories || DEFAULT_CATS, expenses: d.expenses || [], budgets: d.budgets || {} };
      loaded = true;
      $("loading").style.display = "none";
      setSyncStatus("ok");
      renderAll();
    }
  }, (e)=>{ console.error(e); setSyncStatus("error"); $("loading").style.display = "none"; });
}

// Read-modify-write inside a transaction, so two phones editing at once don't erase each other's changes.
function notReady(){
  if(loaded) return false;
  showToast("Still loading your budget. Try again in a moment.");
  return true;
}
async function mutate(fn){
  if(notReady()) return false;
  setSyncStatus("syncing");
  try{
    await runTransaction(db, async tx => {
      const snap = await tx.get(DOC);
      const d = snap.exists() ? snap.data() : {};
      const patch = fn({ categories: d.categories || DEFAULT_CATS, expenses: d.expenses || [], budgets: d.budgets || {} });
      if(snap.exists()) tx.update(DOC, patch); else tx.set(DOC, { version: 2, categories: DEFAULT_CATS, expenses: [], budgets: {}, ...patch });
    });
    setSyncStatus("ok");
    return true;
  }catch(e){
    console.error(e);
    setSyncStatus("error");
    showToast("Couldn't save. Check your connection and try again.");
    return false;
  }
}
async function safeWrite(promiseFn){
  if(notReady()) return false;
  setSyncStatus("syncing");
  try{ await promiseFn(); setSyncStatus("ok"); return true; }
  catch(e){ console.error(e); setSyncStatus("error"); showToast("Couldn't save. Check your connection and try again."); return false; }
}

// ── Auth & PIN ────────────────────────────────────────────────────────────
let pinBuffer = "";
let pinUser = null;
let pinTries = 0;
let pinLockedUntil = 0;

function renderLoginUsers(){
  $("login-users").innerHTML = Object.entries(USERS).map(([key,u])=>`
    <button class="login-btn" style="border-color:${u.color};" data-user="${key}">
      <div class="login-avatar" style="background:${u.color};" aria-hidden="true">${u.avatar}</div>
      <span class="login-name">${u.label}</span>
    </button>`).join("");
}

function showScreen(id){
  ["login-screen","pin-screen","app"].forEach(s=>{ $(s).style.display = s===id ? "flex" : "none"; });
}

function selectUser(user){
  pinUser = user;
  pinBuffer = "";
  showScreen("pin-screen");
  $("pin-avatar").textContent = USERS[user].avatar;
  $("pin-avatar").style.background = USERS[user].color;
  $("pin-name").textContent = USERS[user].label;
  $("pin-error").textContent = "";
  updatePinDots();
  document.querySelector('.pin-key[data-pin="1"]').focus();
}

function pinKey(digit){
  if(Date.now() < pinLockedUntil) return;
  if(pinBuffer.length >= 4) return;
  pinBuffer += digit;
  $("pin-error").textContent = "";
  updatePinDots();
  if(pinBuffer.length === 4) setTimeout(checkPin, 120);
}

function pinBackspace(){
  pinBuffer = pinBuffer.slice(0,-1);
  updatePinDots(false);
  $("pin-error").textContent = "";
}

function backToUsers(){
  showScreen("login-screen");
  pinBuffer = "";
  pinUser = null;
}

function updatePinDots(showError=false){
  for(let i=0;i<4;i++){
    $("pd"+i).className = "pin-dot" + (i < pinBuffer.length ? " filled" : "") + (showError ? " error" : "");
  }
  $("pin-progress").textContent = `${pinBuffer.length} of 4 digits entered`;
}

async function checkPin(){
  let ok = false;
  try { ok = (await window.hashPin(pinUser, pinBuffer)) === PIN_HASHES[pinUser]; }
  catch(e){ $("pin-error").textContent = "This browser can't check the PIN. Open the app from its https address."; }
  if(ok){
    pinTries = 0;
    store("budget:lastUser", pinUser);
    loginUser(pinUser);
  } else {
    pinTries++;
    updatePinDots(true);
    if(pinTries >= MAX_PIN_TRIES){
      pinLockedUntil = Date.now() + PIN_LOCK_MS;
      pinTries = 0;
      $("pin-error").textContent = "Too many tries. Wait 30 seconds and try again.";
    } else if(!$("pin-error").textContent){
      $("pin-error").textContent = "Incorrect PIN. Try again.";
    }
    setTimeout(()=>{ pinBuffer = ""; updatePinDots(false); }, 900);
  }
}

async function loginUser(user){
  currentUser = user;
  showScreen("app");
  const badge = $("user-badge");
  badge.textContent = USERS[user].avatar;
  badge.style.background = USERS[user].color;
  currentMonth = getMonthKey();
  reportMonth = currentMonth;
  renderMonthLabel();
  renderLogFilters();
  switchView("dashboard");
  if(!loaded) $("loading").style.display = "flex";
  await initFirestore();
}

function signOut(){
  if(unsubscribe) unsubscribe();
  unsubscribe = null;
  loaded = false;
  currentUser = null;

// ── View switching ────────────────────────────────────────────────────────
function switchView(view){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));

// ── Derived ───────────────────────────────────────────────────────────────
const byNewest = (a,b) => new Date(b.date) - new Date(a.date);
function monthExpenses(mk=currentMonth){ return (state.expenses||[]).filter(e=>e.monthKey===mk).sort(byNewest); }
function catById(id){ return (state.categories||[]).find(c=>c.id===id); }

function budgetForMonth(mk=currentMonth){
  const saved = (state.budgets||{})[mk] || {};
  const result = {};
  (state.categories||[]).forEach(c=>{ result[c.id] = Number(saved[c.id] ?? c.budget) || 0; });
  return result;
}

function spentByCategory(mk=currentMonth){
  const map = {};
  (state.categories||[]).forEach(c=>{ map[c.id]=0; });
  monthExpenses(mk).forEach(e=>{ if(map[e.categoryId]!==undefined) map[e.categoryId]+=Number(e.amount)||0; });
  return map;
}

// Days left in the month including today (current month only).
function paceInfo(mk, left){
  const now = getMonthKey();
  if(mk < now) return { text: "Month closed", sub: left>=0 ? `Finished ${money(left)} under budget` : `Finished ${money(-left)} over budget` };
  if(mk > now) return { text: "Upcoming month", sub: "" };
  const daysLeft = daysInMonth(mk) - new Date().getDate() + 1;
  if(left <= 0) return { text: `${daysLeft} day${daysLeft===1?"":"s"} left`, sub: "Budget used up for this month" };
  return { text: `${money(left/daysLeft)} a day`, sub: `for the ${daysLeft} day${daysLeft===1?"":"s"} left` };
}

// ── Render all ────────────────────────────────────────────────────────────
function renderAll(){
  if(!currentUser) return;
  if(currentView==="dashboard") renderDashboard();
  if(currentView==="log") renderLog();
  if(currentView==="categories") renderCategories();
  if(currentView==="reports") renderReports();
  if($("modal-catdetail").classList.contains("open")) renderCategoryDetail();
}

// ── Dashboard ─────────────────────────────────────────────────────────────
function renderDashboard(){
  const bfm = budgetForMonth();
  const sbc = spentByCategory();
  const totalBudget = Object.values(bfm).reduce((s,v)=>s+v,0);
  const totalSpent = Object.values(sbc).reduce((s,v)=>s+v,0);
  const left = totalBudget - totalSpent;
  const pct = totalBudget>0 ? Math.min(100,(totalSpent/totalBudget)*100) : 0;

  $("ov-budget").textContent = money(totalBudget);
  $("ov-remaining-lbl").textContent = left<0 ? "Over budget" : "Left to spend";
  const remEl = $("ov-remaining");
  remEl.textContent = money(Math.abs(left));
  remEl.className = "ov-value" + (left<0?" danger":"");
  const bar = $("ov-bar");
  bar.style.width = `${pct}%`;
  bar.style.background = pct>90?"#FFD4D4":pct>70?"#FFE8CC":"rgba(255,255,255,.85)";
  $("ov-progress").setAttribute("aria-valuenow", pct.toFixed(0));
  $("ov-spent-lbl").textContent = `Spent ${money(totalSpent)}`;
  $("ov-pct-lbl").textContent = `${pct.toFixed(0)}% used`;
  const pace = paceInfo(currentMonth, left);
  $("ov-pace").innerHTML = `<span>${esc(pace.text)}</span><small>${esc(pace.sub)}</small>`;

  const exps = monthExpenses();
  $("dash-empty").innerHTML = (!exps.length && loaded)
    ? `<div class="empty-card">No expenses in ${esc(monthLabel(currentMonth))} yet.<br><button class="secondary-btn" data-open="modal-expense" style="margin-top:12px">+ Log the first one</button></div>`
    : "";

  $("cat-grid").innerHTML = (state.categories||[]).map(cat=>{
    const budget = bfm[cat.id]||0;
    const spent = sbc[cat.id]||0;
    const l = budget-spent;
    const p = budget>0?Math.min(100,(spent/budget)*100):(spent>0?100:0);
    const color = safeColor(cat.color);
    const barColor = p>90?"#C97B7B":p>70?"#BE9B7B":color;
    const overBudget = l < 0;
    const label = `${cat.name}: ${overBudget ? money(-l)+" over" : money(l)+" left"} of ${money(budget)}`;
    return `<div class="cat-card${overBudget?' over-budget-card':''}" role="button" tabindex="0" data-cat="${esc(cat.id)}" aria-label="${esc(label)}">
      <div class="cat-card-name">
        ${esc(cat.name)}
        ${overBudget
          ? '<span class="over-budget-badge" aria-hidden="true">⚠️</span>'
          : `<div class="cat-dot" style="background:${color}" aria-hidden="true"></div>`}
      </div>
      <div class="cat-remaining" style="color:${overBudget?"#A85656":"#2D2A26"}">${money(Math.abs(l))}</div>
      <div class="cat-sub">${overBudget?"over":"left"} of ${money(budget)}</div>
      <div class="progress-bg" aria-hidden="true"><div class="progress-fill" style="width:${p}%;background:${barColor}"></div></div>
      <div class="cat-spent">Spent ${money(spent)}</div>

  }).join("");

  const recent = exps.slice(0,5);
  $("recent-label").style.display = recent.length?"block":"none";

}

// ── Reports ───────────────────────────────────────────────────────────────
function renderReports(){
  const allMonths = [...new Set((state.expenses||[]).map(e=>e.monthKey))].filter(Boolean).sort().reverse();
  if(!allMonths.includes(currentMonth)) { allMonths.push(currentMonth); allMonths.sort().reverse(); }
  const months = allMonths.slice(0,6);
  if(!months.includes(reportMonth)) reportMonth = months[0];

  $("report-months").innerHTML = months.map(mk=>
    `<button class="filter-btn${mk===reportMonth?" active":""}" data-report="${esc(mk)}" aria-pressed="${mk===reportMonth}">${esc(monthLabel(mk))}</button>`).join("");

  const exps = monthExpenses(reportMonth);
  const rc = $("report-content");
  if(!exps.length){ rc.innerHTML=`<div class="empty">No expenses logged in ${esc(monthLabel(reportMonth))} yet</div>`; return; }

  const bfm = budgetForMonth(reportMonth);
  const totalBudget = Object.values(bfm).reduce((s,v)=>s+v,0);
  const totalSpent = exps.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const remaining = totalBudget - totalSpent;

  const byUser = {};
  Object.keys(USERS).forEach(u=>byUser[u]=0);
  exps.forEach(e=>{ byUser[e.user]=(byUser[e.user]||0)+(Number(e.amount)||0); });

  const byCat = {};
  (state.categories||[]).forEach(c=>{ byCat[c.id]={id:c.id,name:c.name,color:safeColor(c.color),amount:0}; });
  exps.forEach(e=>{ if(byCat[e.categoryId]) byCat[e.categoryId].amount+=Number(e.amount)||0; });
  const catArr = Object.values(byCat).filter(v=>v.amount>0).sort((a,b)=>b.amount-a.amount);
  const top = catArr[0];
  const overCats = catArr.filter(c=>(bfm[c.id]||0)>0 && c.amount>bfm[c.id]);

  rc.innerHTML = `
    <div class="overview-card" style="margin-bottom:20px">
      <div class="stat-grid">
        <div class="stat-item"><div class="stat-label">Spent</div><div class="stat-value">${money(totalSpent)}</div></div>
        <div class="stat-item"><div class="stat-label">${remaining<0?"Over budget":"Left"}</div><div class="stat-value">${money(Math.abs(remaining))}</div></div>
        <div class="stat-item"><div class="stat-label">Expenses</div><div class="stat-value">${exps.length}</div></div>
      </div>
    </div>
    <h2 class="section-label" style="margin-bottom:10px">By person</h2>
    <div class="user-cards">
      ${Object.entries(byUser).map(([u,amt])=>`
        <div class="user-card">
          <div class="user-badge" style="background:${USERS[u]?.color||"#888"};margin-bottom:8px" aria-hidden="true">${esc(USERS[u]?.avatar||u[0])}</div>
          <div class="user-card-amt">${money(amt)}</div>
          <div class="user-card-name">${esc(u)}</div>
        </div>`).join("")}
    </div>
    <h2 class="section-label" style="margin-bottom:12px">Spent vs each category's budget</h2>
    ${catArr.map(c=>{
      const catBudget = bfm[c.id] || 0;
      const rawPct = catBudget > 0 ? (c.amount/catBudget)*100 : 0;
      const barPct = Math.min(100, rawPct);
      const overOwn = c.amount > catBudget && catBudget > 0;
      const ownBarColor = overOwn ? "#C97B7B" : rawPct > 80 ? "#BE9B7B" : c.color;
      return `<div class="bar-row">
        <div class="bar-labels">
          <span class="bar-name">${esc(c.name)}</span>
          <span class="bar-amt" style="color:${overOwn?"#A85656":"#2D2A26"}">${money(c.amount)} <span style="color:#6F665C;font-weight:400">(${rawPct.toFixed(0)}% of ${money(catBudget)})</span>${overOwn?' <span style="font-size:11px">⚠️ over</span>':''}</span>
        </div>
        <div class="progress-bg" style="background:#F0EDE6" aria-hidden="true">
          <div class="progress-fill" style="width:${barPct}%;background:${ownBarColor}"></div>
        </div>
      </div>`;
    }).join("")}
    <h2 class="section-label" style="margin-bottom:12px;margin-top:24px">Share of total spending</h2>
    ${catArr.map(c=>{
      const pct = totalSpent>0?(c.amount/totalSpent)*100:0;
      return `<div class="bar-row">
        <div class="bar-labels">
          <span class="bar-name">${esc(c.name)}</span>
          <span class="bar-amt" style="color:#2D2A26">${money(c.amount)} <span style="color:#6F665C;font-weight:400">(${pct.toFixed(0)}%)</span></span>
        </div>
        <div class="progress-bg" style="background:#F0EDE6" aria-hidden="true">
          <div class="progress-fill" style="width:${pct}%;background:${c.color}"></div>
        </div>
      </div>`;
    }).join("")}
    ${top?`<div class="insight-card"><div style="font-size:20px;margin-bottom:6px" aria-hidden="true">💡</div>
      <div class="insight-title">Top spending: ${esc(top.name)}</div>
      <div class="insight-body">${money(top.amount)} (${totalSpent>0?((top.amount/totalSpent)*100).toFixed(0):0}% of the total) went to ${esc(top.name)} in ${esc(monthLabel(reportMonth))}.${overCats.length?` ${overCats.length} categor${overCats.length===1?"y went":"ies went"} over budget: ${overCats.map(c=>esc(c.name)).join(", ")}.`:" Every category stayed within its budget."}</div>
    </div>`:""}`;
}

// ── Actions: expenses ─────────────────────────────────────────────────────
function defaultDateFor(mk){
  const now = getMonthKey();
  if(mk === now) return new Date();
  const [y,m] = mk.split("-").map(Number);
  return mk < now ? new Date(y, m, 0, 12) : new Date(y, m-1, 1, 12);
}
function dateToIso(inputVal){
  if(!inputVal) return new Date().toISOString();
  const d = fromDateInput(inputVal);
  // Logging for today keeps the real time, so the newest entry sorts first.
  if(d.toDateString() === new Date().toDateString()) return new Date().toISOString();
  return d.toISOString();
}

function openExpenseModal(catId){
  const catSel = $("exp-cat");
  const preferred = catId || load("budget:lastCat");
  catSel.innerHTML = (state.categories||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  if(preferred && catById(preferred)) catSel.value = preferred;
  $("exp-date").value = toDateInput(defaultDateFor(currentMonth));
  $("exp-amount").value = "";
  $("exp-note").value = "";
  $("exp-error").textContent = "";
  updateRemainingHint();
  showModal("modal-expense", "exp-amount");
}

async function submitExpense(){
  const catId = $("exp-cat").value;
  const amount = parseAmount($("exp-amount").value);
  const note = $("exp-note").value.trim();
  const dateVal = $("exp-date").value;
  if(!catId){ $("exp-error").textContent = "Pick a category."; return; }
  if(!(amount > 0)){ $("exp-error").textContent = "Enter an amount greater than $0."; $("exp-amount").focus(); return; }
  if(!dateVal){ $("exp-error").textContent = "Pick a date."; return; }
  const iso = dateToIso(dateVal);
  const mk = getMonthKey(new Date(iso));
  // Work out what's left before saving; the listener updates state as soon as the write lands.
  const rem = (budgetForMonth(mk)[catId]||0) - (spentByCategory(mk)[catId]||0) - amount;
  const exp = { id:uid(), categoryId:catId, amount, note, user:currentUser, date:iso, monthKey:mk };
  const btn = document.querySelector("#form-expense .primary-btn");
  btn.disabled = true;
  const ok = await safeWrite(()=>updateDoc(DOC, { expenses: arrayUnion(exp) }));
  btn.disabled = false;
  if(!ok) return;
  store("budget:lastCat", catId);
  closeModal("modal-expense");
  const cat = catById(catId);
  showToast(`✓ ${money(amount)} to ${cat?.name}. ${rem>=0 ? money(rem)+" left" : money(-rem)+" over"}${mk!==currentMonth?` (${monthLabel(mk)})`:""}`);
}

async function deleteExpense(id){
  const exp = (state.expenses||[]).find(e=>e.id===id);
  if(!exp) return;
  // Delete by id inside a transaction, so it still works if the other phone edited this expense.
  const ok = await mutate(d=>({ expenses: d.expenses.filter(e=>e.id!==id) }));
  if(!ok) return;
  showToast(`Deleted ${money(exp.amount)} ${catById(exp.categoryId)?.name||""}`, {
    label: "Undo",
    run: async ()=>{ if(await safeWrite(()=>updateDoc(DOC, { expenses: arrayUnion(exp) }))) showToast("Expense restored"); }
  });
}

async function submitEditExpense(){

  const catId = $("edit-exp-cat").value;
  const amount = parseAmount($("edit-exp-amount").value);

async function deleteCat(id){

    ? `Delete "${cat.name}"?\n\nThis also deletes its ${count} expense${count===1?"":"s"} in every month, and can't be undone.`

    categories: d.categories.filter(c=>c.id!==id),

// ── Modal helpers ─────────────────────────────────────────────────────────
function showModal(id, focusId){
  if(!document.querySelector(".modal-overlay.open")) lastFocus = document.activeElement;
  document.querySelectorAll(".modal-overlay.open").forEach(m=>{ if(m.id!==id) m.classList.remove("open"); });
  $(id).classList.add("open");
  const target = focusId ? $(focusId) : $(id).querySelector(".modal-close");
  setTimeout(()=>target?.focus(), 50);
}
function openModal(id){
  if(id==="modal-expense") return openExpenseModal();
  if(id==="modal-addcat"){
    selectedAddColor=PALETTE[0]; renderPalette("addcat-palette","add");
    $("addcat-name").value=""; $("addcat-budget").value=""; $("addcat-error").textContent="";
    return showModal(id, "addcat-name");
  }
  showModal(id);
}
function closeModal(id){
  $(id).classList.remove("open");
  if(lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}

function updateRemainingHint(){
  const catId = $("exp-cat").value;
  const hint = $("remaining-hint");
  if(!catId){ hint.textContent=""; return; }
  const dateVal = $("exp-date").value;
  const mk = dateVal ? getMonthKey(fromDateInput(dateVal)) : currentMonth;
  const rem = (budgetForMonth(mk)[catId]||0)-(spentByCategory(mk)[catId]||0);
  const cat = catById(catId);
  hint.textContent = rem>=0 ? `${money(rem)} left in ${cat?.name} for ${monthLabel(mk)}` : `${cat?.name} is ${money(-rem)} over for ${monthLabel(mk)}`;
  hint.style.color = rem>=0?"#4F7360":"#A85656";
}

function renderPalette(containerId, mode){
  const sel = mode==="add"?selectedAddColor:selectedEditColor;
  $(containerId).innerHTML = PALETTE.map((c,i)=>`
    <button type="button" class="color-swatch${c===sel?" selected":""}" style="background:${c}" role="radio" aria-checked="${c===sel}" aria-label="Color ${i+1}" data-color="${c}" data-mode="${mode}" data-palette="${containerId}"></button>
  `).join("");
}

// ── Toast ─────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, action){
  const t = $("toast");
  t.innerHTML = "";
  const span = document.createElement("span");
  span.textContent = msg;
  t.appendChild(span);
  if(action){
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = action.label;
    b.onclick = ()=>{ t.style.display="none"; action.run(); };
    t.appendChild(b);
  }
  t.style.display = "flex";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.style.display="none", action ? 6000 : 3500);
}

// ── Event wiring (no inline handlers, so stored text can't inject code) ──
document.addEventListener("click", e=>{
  const el = e.target.closest("button,[data-cat]");
  if(!el) return;
  const d = el.dataset;
  if(d.user) return selectUser(d.user);
  if(d.pin) return pinKey(d.pin);
  if(d.view) return switchView(d.view);
  if(d.open) return openModal(d.open);
  if(d.close) return closeModal(d.close);
  if(d.cat) return openCategoryDetail(d.cat);
  if(d.editExp) return openEditExpense(d.editExp);
  if(d.delExp) return deleteExpense(d.delExp);
  if(d.editCat) return openEditCat(d.editCat);
  if(d.delCat) return deleteCat(d.delCat);
  if(d.filter){ logFilter = d.filter; return renderLog(); }
  if(d.report){ reportMonth = d.report; return renderReports(); }
  if(d.color){
    if(d.mode==="add") selectedAddColor=d.color; else selectedEditColor=d.color;
    return renderPalette(d.palette, d.mode);
  }
});
document.addEventListener("keydown", e=>{
  const card = e.target.closest?.("[data-cat]");
  if(card && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openCategoryDetail(card.dataset.cat); return; }
  if(e.key==="Escape"){
    const open = [...document.querySelectorAll(".modal-overlay.open")].pop();
    if(open) closeModal(open.id);
    return;
  }
  if($("pin-screen").style.display==="flex"){
    if(/^[0-9]$/.test(e.key)) pinKey(e.key);
    else if(e.key==="Backspace") pinBackspace();
  }
});

$("pin-back").addEventListener("click", backToUsers);

$("exp-cat").addEventListener("change", updateRemainingHint);
$("exp-date").addEventListener("change", updateRemainingHint);
$("catdetail-log").addEventListener("click", ()=>openExpenseModal(detailCatId));
$("catdetail-budget").addEventListener("click", openEditBudget);
$("editexp-delete").addEventListener("click", ()=>{ const id = editingExpenseId; closeModal("modal-editexp"); deleteExpense(id); });

const forms = {
  "form-expense": submitExpense, "form-editexp": submitEditExpense, "form-addcat": submitAddCategory,
  "form-editcat": submitEditCategory, "form-editbudget": submitEditBudget,
};
Object.entries(forms).forEach(([id,fn])=>$(id).addEventListener("submit", e=>{ e.preventDefault(); fn(); }));

// Close a sheet by tapping outside it, unless something has been typed into it.
document.querySelectorAll(".modal-overlay").forEach(o=>{
  o.addEventListener("click", e=>{
    if(e.target!==o) return;
    const typed = [...o.querySelectorAll("input[type=number],input[type=text]")].some(i=>i.value && i.value!==i.defaultValue);
    if(typed && o.id==="modal-expense") return;
    closeModal(o.id);
  });
});

// ── Boot ──────────────────────────────────────────────────────────────────
renderLoginUsers();
renderMonthLabel();
$("loading").style.display = "none";
const lastUser = load("budget:lastUser");
if(lastUser && USERS[lastUser]) selectUser(lastUser); else showScreen("login-screen");

</script>
